# Dejen app icons. Run:  dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
# (or paste this block under your pubspec.yaml and run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/branding/icon/dejen_appicon_charcoal.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

  # Shield on charcoal (NOT the green-circle gradient). Matching charcoal adaptive
  # background so the green shield floats and is never masked into a solid disc.
  adaptive_icon_background: "#0C1813"
  adaptive_icon_foreground: "assets/branding/icon/dejen_appicon_charcoal.png"

  # NOTE: this app only has android/ios platform folders, so web/windows/macos
  # icon generation (present in the original kit) is intentionally omitted.
